[package]
name = "sigmabridge-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "OpenAI-compatible bridge for the Sigma browser chat backend"

[[bin]]
name = "sigmabridge-bot"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "gzip", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
